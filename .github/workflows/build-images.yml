name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: open-instinct-agent
            dockerfile: deploy/Dockerfile.agent
          - name: open-instinct-gateway
            dockerfile: deploy/Dockerfile.gateway
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        run: |
          TAG=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest
          docker buildx build \
            --file ${{ matrix.image.dockerfile }} \
            --platform linux/amd64 \
            --tag $TAG \
            --progress=plain \
            .
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
        id: build

      - name: Push image
        run: |
          docker push ${{ steps.build.outputs.TAG }}