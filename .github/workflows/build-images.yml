name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: open-instinct-agent
            dockerfile: deploy/Dockerfile.agent
          - name: open-instinct-gateway
            dockerfile: deploy/Dockerfile.gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent
        if: matrix.image.name == 'open-instinct-agent'
        run: |
          TAG=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:test
          docker buildx build \
            --file ${{ matrix.image.dockerfile }} \
            --platform linux/amd64 \
            --tag $TAG \
            --push \
            --progress=plain \
            .

      - name: Build and push gateway
        if: matrix.image.name != 'open-instinct-agent'
        run: |
          TAG=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest
          docker buildx build \
            --file ${{ matrix.image.dockerfile }} \
            --platform linux/amd64 \
            --tag $TAG \
            --push \
            --progress=plain \
            .