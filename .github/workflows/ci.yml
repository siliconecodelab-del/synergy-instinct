name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run smoke test
        run: pnpm run smoke

      - name: No CommonJS require() in ESM source
        run: |
          if grep -rn "require(" packages --include="*.ts" | grep -v "node_modules" | grep -v "dist/" | grep -v "test/" | grep "node:" ; then
            echo "ERROR: Found require() calls in ESM source files"
            exit 1
          fi
          echo "OK: No require() calls in ESM source"

      - name: No leftover secrets or personal identifiers
        run: |
          ! grep -rIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git -E "ApiKey_[0-9a-f]{8}-[0-9a-f]{4}|sk-ant-[A-Za-z0-9_-]{20,}|mk_[A-Za-z0-9_-]{30,}|liwl(token|refresh)_" . | grep -vE "test/|\.gitleaks\.toml"

  windows-inkbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-instinct/core build
      - run: pnpm --filter @open-instinct/inkbox build
      - run: pnpm exec vitest run packages/inkbox/test/inbox.test.ts
