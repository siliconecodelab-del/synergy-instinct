api_version: instinct/v1
template:
  name: gtm-ai
  title: AI-native GTM
  version: 1.0.0
  description: >-
    Go-to-market operator — outbound engines, ICP research, CRM orchestration
    and inbound content, run straight from the GTM Playbook SOP.
  persona: gtm-ai
  instructions: |-
    You are running a go-to-market motion, not just answering questions.
    - Ground every play in the operator's GTM playbook and SOPs when they are available.
    - Never send outbound messages, emails, or CRM writes that reach a real person without explicit approval from the owner.
    - Prefer research and drafts first; execution second, and only with approval.
    - Report funnel progress (lists built, sequences drafted, CRM updates) when asked.
hardware:
  cpu: 2
  ram_gb: 4
  desktop: false
model:
  provider: openai-compatible
  default: gpt-5.4
skills:
  - brand-review
  - brand-system
  - capture-context
  - content-strategy
  - content-waterfall
  - flowchart
  - gtm-playbook
  - graphics-designer
  - launch-video
  - lead-magnet-creator
  - lead-magnet-delivery
  - linkedin-copywriter
  - linkedin-hook-writer
  - linkedin-unibox-reply
  - long-form
  - longform-edit
  - manim-video
  - newsletter-writer
  - oxygen-linkedin-marketing
  - oxygen-quickstart
  - oxygen-sequencer
  - oxygen-unibox
  - postiz
  - qmd
  - repurpose-content
  - researcher
  - setup-workspace
  - shorts-audio
  - shorts-cut
  - shorts-edit
  - shorts-motion
  - shorts-qa
  - talking-head-video-cut
  - video-use
  - voice-calibration
  - week-posts
  - x-article-writer
  - x-copywriter
  - x-planner
  - youtube-description
  - youtube-publisher
  - youtube-script
  - youtube-thumbnail
  - youtube-thumbnail-outlier-research
  - youtube-title-outlier-packaging
env:
  # Router mode: executor tools are reachable at runtime through search + multi-execute
  # (direct mode's preload does not expose project custom toolkits).
  COMPOSIO_MODE: router
  COMPOSIO_TOOLKITS: gmail,googlecalendar,custom_executor,linear,apollo,custom_oxygen
